services:
  postgres:
    image: postgres:16-alpine
    container_name: split-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: split
      POSTGRES_USER: split
      POSTGRES_PASSWORD: split_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split -d split"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
